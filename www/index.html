<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FF MABAR 2 ORANG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a2f1a;color:white;font-family:Arial,sans-serif;overflow:hidden;height:100vh;touch-action:none}
#header{display:flex;justify-content:space-between;padding:10px;background:#111;font-weight:bold;font-size:13px}
#header span{background:#ffca28;color:#000;padding:3px 8px;border-radius:20px}
#header .p2 span{background:#29b6f6}
#game{position:relative;width:100%;height:calc(100vh - 170px);overflow:hidden;background:#2d4a2b;background-image:radial-gradient(#3a5f36 20%, transparent 20%);background-size:40px 40px}
.p{position:absolute;font-size:36px;z-index:5}
.enemy{position:absolute;font-size:32px;z-index:4}
.bullet{position:absolute;width:8px;height:8px;border-radius:50%;z-index:3}
.b1{background:#ffeb3b;box-shadow:0 0 8px yellow}
.b2{background:#29b6f6;box-shadow:0 0 8px cyan}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:20;text-align:center;padding:20px}
#overlay h1{font-size:30px;color:#ffca28;margin-bottom:10px}
#overlay p{line-height:1.6;margin-bottom:18px}
button{background:#ffca28;color:#000;border:none;padding:13px 26px;border-radius:30px;font-size:16px;font-weight:bold}
#controls{height:130px;background:#111;position:relative}
#joy{position:absolute;left:12px;top:15px;width:85px;height:85px;background:#333;border-radius:50%;border:2px solid #555}
#stick{position:absolute;left:28px;top:28px;width:28px;height:28px;background:#ffca28;border-radius:50%}
.btn{position:absolute;border:none;border-radius:50%;color:white;font-weight:bold}
#shoot1{left:105px;top:25px;width:60px;height:60px;background:#e53935;font-size:24px}
#shoot2{right:12px;top:15px;width:60px;height:60px;background:#0288d1;font-size:24px}
#up2{right:85px;top:5px;width:45px;height:45px;background:#444;font-size:18px}
#down2{right:85px;top:60px;width:45px;height:45px;background:#444;font-size:18px}
#left2{right:135px;top:35px;width:45px;height:45px;background:#444;font-size:18px}
#right2{right:35px;top:60px;width:45px;height:45px;background:#444;font-size:18px}
#info{text-align:center;font-size:11px;opacity:.6;padding:2px}
</style>
</head>
<body>
<div id="header">
  <div>🪖 P1 BID: <span id="k1">0 KILL</span></div>
  <div class="p2">🎯 P2 TEMEN: <span id="k2">0 KILL</span></div>
  <div>👹 MUSUH: <span id="mus">12</span></div>
</div>

<div id="game">
  <div id="p1" class="p">🪖</div>
  <div id="p2" class="p">🥷</div>
  <div id="overlay">
    <h1>🔥 FF MABAR 🔥<br>2 ORANG 1 HP</h1>
    <p><b>P1 BID (Kiri):</b> Joystick + Tombol Merah<br><b>P2 TEMEN (Kanan):</b> Tombol Panah + Tombol Biru<br>Siapa kill paling banyak, dia yang BOOYAH!</p>
    <button onclick="mulai()">MULAI MABAR</button>
  </div>
</div>

<div id="controls">
  <div id="joy"><div id="stick"></div></div>
  <button id="shoot1" class="btn" onclick="tembak(1)">🔫</button>
  <button id="up2" class="btn" onclick="move2(0,-8)">⬆️</button>
  <button id="down2" class="btn" onclick="move2(0,8)">⬇️</button>
  <button id="left2" class="btn" onclick="move2(-8,0)">⬅️</button>
  <button id="right2" class="btn" onclick="move2(8,0)">➡️</button>
  <button id="shoot2" class="btn" onclick="tembak(2)">🔫</button>
</div>
<div id="info">Mabar lokal - 1 HP berdua - by Bid</div>

<script>
let jalan=false, k1=0, k2=0;
let p1={x:20,y:50,dx:0,dy:0,dir:{x:0,y:-1}};
let p2={x:80,y:50,dir:{x:0,y:-1}};
let enemies=[], bullets=[];
let game=document.getElementById('game');
let overlay=document.getElementById('overlay');

function mulai(){
  jalan=true; k1=0; k2=0; p1={x:20,y:50,dx:0,dy:0,dir:{x:0,y:-1}}; p2={x:80,y:50,dir:{x:0,y:-1}};
  updateUI();
  overlay.style.display='none';
  document.querySelectorAll('.enemy,.bullet').forEach(e=>e.remove());
  enemies=[]; bullets=[];
  for(let i=0;i<12;i++) spawnMusuh();
  requestAnimationFrame(loop);
}
function updateUI(){
  document.getElementById('k1').textContent=k1+' KILL';
  document.getElementById('k2').textContent=k2+' KILL';
  document.getElementById('mus').textContent=enemies.length;
}
function spawnMusuh(){
  let e=document.createElement('div');
  e.className='enemy'; e.textContent=['😈','👹','💀','🤖','👽'][Math.floor(Math.random()*5)];
  let x=Math.random()*85+5, y=Math.random()*70+5;
  e.style.left=x+'%'; e.style.top=y+'%';
  game.appendChild(e);
  enemies.push({el:e,x:x,y:y,hp:2});
}
function move2(dx,dy){
  if(!jalan) return;
  p2.x+=dx; p2.y+=dy;
  p2.x=Math.max(2,Math.min(94,p2.x)); p2.y=Math.max(2,Math.min(90,p2.y));
  if(dx!=0||dy!=0) p2.dir={x:dx/8,y:dy/8};
  document.getElementById('p2').style.left=p2.x+'%';
  document.getElementById('p2').style.top=p2.y+'%';
}
function tembak(p){
  if(!jalan) return;
  let pos = p==1?p1:p2;
  let b=document.createElement('div');
  b.className='bullet '+(p==1?'b1':'b2');
  b.style.left=pos.x+'%'; b.style.top=pos.y+'%';
  game.appendChild(b);
  bullets.push({el:b,x:pos.x,y:pos.y,dx:pos.dir.x*2.4,dy:pos.dir.y*2.4,owner:p});
  if(navigator.vibrate) navigator.vibrate(15);
}

// Joystick P1
let joy=document.getElementById('joy'), stick=document.getElementById('stick'), dragging=false;
function joyMove(e){
  let r=joy.getBoundingClientRect();
  let cx=(e.touches[0].clientX)-r.left-42, cy=(e.touches[0].clientY)-r.top-42;
  let len=Math.sqrt(cx*cx+cy*cy)||1; if(len>28){cx=cx/len*28;cy=cy/len*28}
  stick.style.left=(28+cx)+'px'; stick.style.top=(28+cy)+'px';
  p1.dx=cx/28; p1.dy=cy/28;
  if(Math.abs(p1.dx)>0.2||Math.abs(p1.dy)>0.2) p1.dir={x:p1.dx,y:p1.dy};
}
joy.addEventListener('touchstart',e=>{dragging=true;joyMove(e)});
joy.addEventListener('touchmove',e=>{if(dragging)joyMove(e)});
joy.addEventListener('touchend',()=>{dragging=false;p1.dx=0;p1.dy=0;stick.style.left='28px';stick.style.top='28px'});

function loop(){
  if(!jalan) return;
  p1.x+=p1.dx*1.3; p1.y+=p1.dy*1.3;
  p1.x=Math.max(2,Math.min(94,p1.x)); p1.y=Math.max(2,Math.min(90,p1.y));
  document.getElementById('p1').style.left=p1.x+'%';
  document.getElementById('p1').style.top=p1.y+'%';

  bullets.forEach((b,bi)=>{
    b.x+=b.dx; b.y+=b.dy;
    b.el.style.left=b.x+'%'; b.el.style.top=b.y+'%';
    if(b.x<0||b.x>95||b.y<0||b.y>95){b.el.remove();bullets.splice(bi,1);return;}
    enemies.forEach((m,mi)=>{
      if(Math.abs(b.x-m.x)<4 && Math.abs(b.y-m.y)<5){
        m.hp--; b.el.remove(); bullets.splice(bi,1);
        if(m.hp<=0){
          m.el.textContent='💥'; setTimeout(()=>m.el.remove(),200);
          enemies.splice(mi,1);
          if(b.owner==1) k1++; else k2++;
          updateUI();
          if(enemies.length==0) menang();
        }
      }
    });
  });

  // musuh jalan random
  enemies.forEach(m=>{
    m.x+=(Math.random()-0.5)*0.6; m.y+=(Math.random()-0.5)*0.6;
    m.x=Math.max(2,Math.min(94,m.x)); m.y=Math.max(2,Math.min(90,m.y));
    m.el.style.left=m.x+'%'; m.el.style.top=m.y+'%';
  });
  requestAnimationFrame(loop);
}
function menang(){
  jalan=false;
  let pemenang = k1>k2 ? '🏆 BID MENANG! BOOYAH!' : k2>k1 ? '🏆 TEMEN LU MENANG! BOOYAH!' : '🤝 SERI! REMATCH!';
  overlay.style.display='flex';
  overlay.innerHTML=`<h1>${pemenang}</h1><p>BID: ${k1} KILL<br>TEMEN: ${k2} KILL<br>Revan gak?</p><button onclick="mulai()">REMATCH 🔥</button>`;
}
</script>
</body>
</html>
